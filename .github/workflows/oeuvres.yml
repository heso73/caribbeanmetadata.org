name: Mise à jour des fiches d'œuvres

# Régénère /oeuvres/ et le sitemap à partir de l'API publique (œuvres validées).
# S'exécute chaque lundi, et à la demande (onglet Actions > Run workflow).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer les fiches
        run: python3 tools/build_oeuvres.py
      - name: Publier si des fichiers ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oeuvres sitemap.xml
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "chore: mise à jour automatique des fiches d'œuvres"
            git push
          fi
